name: Backfill 30-Day Insider History

on:
  workflow_dispatch:   # manual trigger only — run once to seed alerts.json

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run backfill
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python backfill.py

      - name: Commit updated alerts.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f alerts.json us_symbols_cache.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: backfill 30-day insider history [skip ci]"
          git push
